<!doctype html><meta charset=utf-8><title>rig view</title>
<style>html,body{margin:0;height:100%;background:#20242a;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const P=new URLSearchParams(location.search);
const FILE=P.get('f')||'assets/hostile.glb';
const CLIP=P.get('clip')||'idle';
const YAW=parseFloat(P.get('yaw')||'0.6');
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth,innerHeight);
r.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const sc=new THREE.Scene(); sc.background=new THREE.Color(0x20242a);
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,200);
sc.add(new THREE.HemisphereLight(0xffffff,0x30343a,1.6));
const d=new THREE.DirectionalLight(0xffffff,2.2); d.position.set(3,6,5); sc.add(d);
const d2=new THREE.DirectionalLight(0x99bbff,.9); d2.position.set(-4,2,-4); sc.add(d2);
const grid=new THREE.GridHelper(6,12,0x556,0x333); sc.add(grid);
let mixer=null, info={};
new GLTFLoader().load(FILE,(g)=>{
  const m=g.scene; sc.add(m);
  const box=new THREE.Box3().setFromObject(m);
  const size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
  /* A skinned mesh's Box3 is computed in bind space and is meaningless here,
     so frame a fixed human-sized volume standing at the origin instead. */
  const H=parseFloat(P.get('h')||'1.8');
  const dist=H*2.2;
  cam.position.set(Math.sin(YAW)*dist, H*0.55, Math.cos(YAW)*dist);
  cam.lookAt(0,H*0.5,0);
  grid.position.y=0; grid.scale.setScalar(H/3);
  let bones=0,skinned=0,tris=0;
  m.traverse(o=>{ if(o.isBone)bones++; if(o.isSkinnedMesh)skinned++;
    if(o.isMesh)tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3; });
  info={clips:g.animations.map(a=>a.name),bones,skinned,tris:Math.round(tris),
        size:[+size.x.toFixed(2),+size.y.toFixed(2),+size.z.toFixed(2)]};
  if(g.animations.length){
    mixer=new THREE.AnimationMixer(m);
    const c=g.animations.find(a=>a.name===CLIP)||g.animations[0];
    mixer.clipAction(c).play();
    info.playing=c.name;
  }
  window.__info=info; window.__ready=true;
},undefined,e=>{ window.__info={error:String(e)}; window.__ready=true; });
const clock=new THREE.Clock();
(function loop(){ requestAnimationFrame(loop);
  const dt=clock.getDelta(); if(mixer)mixer.update(dt);
  r.render(sc,cam); })();
window.__setTime=t=>{ if(mixer){ mixer.setTime(t); } };
</script>
